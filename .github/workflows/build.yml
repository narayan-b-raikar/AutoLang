name: Build add-on

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install markdown polib
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build the add-on
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoLang-addon
          path: dist/*.nvda-addon

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoLang-addon
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.nvda-addon
